<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Animal Welfare System</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

	<style>
		html,
		body {
			height: 100%;
		}

		body {
			display: flex;
			flex-direction: column;
			font-family: Arial, sans-serif;
			background: url('/images/index-background.jpg') no-repeat center center fixed;
			background-size: cover;
			-webkit-background-size: cover;
			-moz-background-size: cover;
			-o-background-size: cover;
			color: #333;
			margin: 0;
			padding: 20px;
			min-height: 100vh;
		}

		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn,
		.login-btn,
		.register-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.donate-btn {
			background-color: #4CAF50;
			margin-right: 10px;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.login-btn {
			background-color: #007bff;
		}

		.login-btn:hover {
			background-color: #0056b3;
		}

		.register-btn {
			background-color: #28a745;
		}

		.register-btn:hover {
			background-color: #218838;
		}

		.container {
			flex: 1;
			width: 80%;
			margin: 100px auto 20px;
			/* Adjusted margin for fixed header */
			padding: 20px;
			background-color: rgba(255, 255, 255, 0.8);
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
		}

		h1 {
			text-align: center;
			color: #4CAF50;
			margin-bottom: 20px;
		}

		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}

		.button-container {
			display: flex;
			justify-content: center;
			gap: 20px;
			margin-top: 20px;
		}
	</style>


	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
	<div class="header">
		<div class="left-section">
			<img src="/images/logo.jpg" alt="PETURA Logo" class="logo">
		</div>
		<div class="center-section">
			<span class="app-name">PETURA: Love Knows No Species</span>
		</div>
		<div class="right-section">
			<a href="/donations" class="donate-btn">
				<i class="fas fa-donate"></i> Donate Now
			</a>
			<a href="/logout" class="logout-btn">
				<i class="fas fa-sign-out-alt"></i> Logout
			</a>
		</div>
	</div>

	<div class="container mt-5">
		<div class="row">
			<h1 class="text-center"> Welcome to PETURA: Love Knows No Species </h1>
		</div>
		<div class="button-container">
			<a href="/login" class="login-btn">
				<i class="fas fa-sign-in-alt"></i> Login
			</a>
			<a href="/register" class="register-btn">
				<i class="fas fa-user-plus"></i> Register
			</a>
		</div>
	</div>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
		</div>
		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-c7cD0bbRpjxXx85+phE2KBgHGNIJ/gj38t5p79AauMgyZL0owbsz2FIk5bDq7g5J"
		crossorigin="anonymous"></script>
</body>

</html>
