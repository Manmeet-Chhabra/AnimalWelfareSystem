<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Total Adoptions Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #343a40;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #e9ecef;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }

        .export-buttons {
            text-align: center;
            margin: 20px 0;
        }

        .export-buttons button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Total Adoptions Report</h1>
    <p th:text="'Total Adoptions: ' + ${totalAdoptions}"></p>

    <!-- Export Buttons -->
    <div class="export-buttons">
        <form th:action="@{/reports/adoptions/export/pdf}" method="get">
            <button type="submit">Export to PDF</button>
        </form>
        <form th:action="@{/reports/adoptions/export/excel}" method="get">
            <button type="submit">Export to Excel</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Animal Name</th>
                <th>Adopter Name</th>
                <th>Adoption Date</th>
                <th>Status</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="adoption : ${adoptionTrends}">
                <td th:text="${adoption.animalName}"></td>
                <td th:text="${adoption.adopterName}"></td>
                <td th:text="${#dates.format(adoption.adoptionDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${adoption.status}"></td>
                <td th:text="${adoption.score}"></td>
            </tr>
        </tbody>
    </table>

    <div class="footer">
        <p>Generated on: <span th:text="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}"></span></p>
    </div>
</body>

</html>
