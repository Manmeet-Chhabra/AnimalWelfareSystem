<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Animal Distribution Report</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background-color: #f9f9f9; 
            color: #333; 
			display: flex;
						flex-direction: column;
						min-height: 100vh;
					}

					.header {
						background-color: #2c3e50;
						padding: 15px 20px;
						display: flex;
						justify-content: space-between;
						align-items: center;
						width: 100%;
						position: fixed;
						top: 0;
						z-index: 100;
						box-sizing: border-box;
					}

					.header .left-section {
						display: flex;
						align-items: center;
					}

					.header .center-section {
						position: absolute;
						left: 50%;
						transform: translateX(-50%);
					}

					.header .right-section {
						display: flex;
						align-items: center;
					}

					.header .logo {
						margin-right: 10px;
						height: 40px;
					}

					.header .app-name {
						font-size: 18px;
						color: white;
						font-weight: bold;
						text-align: center;
					}

					.donate-btn {
						color: white;
						font-size: 16px;
						text-decoration: none;
						padding: 8px 12px;
						background-color: #4CAF50;
						/* Green color for Donate Now button */
						border-radius: 5px;
						margin-right: 10px;
						transition: background-color 0.3s;
					}

					.donate-btn:hover {
						background-color: #45a049;
					}

					.logout-btn {
						color: white;
						font-size: 16px;
						text-decoration: none;
						padding: 8px 12px;
						background-color: #e74c3c;
						border-radius: 5px;
						transition: background-color 0.3s;
					}

					.logout-btn:hover {
						background-color: #c0392b;
					}

        h1 { 
            text-align: center; 
            color: #4CAF50; 
            margin-bottom: 30px; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        th, td { 
            padding: 10px; 
            border: 1px solid #ddd; 
            text-align: center; 
        }
        th { 
            background-color: #f2f2f2; 
            color: #333; 
            font-weight: bold; 
        }
        tbody tr:nth-child(even) { 
            background-color: #f9f9f9; 
        }
        tbody tr:hover { 
            background-color: #e0f7fa; 
        }
        .download-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
		.footer {
					margin-top: 50px;
					text-align: center;
					padding: 10px;
					background-color: #f8f9fa;
				}

				.footer {
					text-align: center;
					margin-top: 20px;
					padding: 20px 0;
					background-color: #2c3e50;
					color: white;
				}

				.footer .footer-links {
					margin-bottom: 10px;
				}

				.footer .footer-links a {
					color: white;
					margin: 0 10px;
					text-decoration: none;
					transition: color 0.3s;
				}

				.footer .footer-links a:hover {
					color: #4CAF50;
				}

				.footer .social-icons {
					margin-top: 10px;
				}

				.footer .social-icons a {
					color: white;
					margin: 0 5px;
					text-decoration: none;
					font-size: 20px;
					transition: color 0.3s;
				}

				.footer .social-icons a:hover {
					color: #4CAF50;
				}
    </style>
</head>
<body>
	<div class="header">
			<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
			<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
			<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now </a>
				<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
			</div>
		</div>
	
    <h1>Animal Distribution Report</h1>

    <!-- Buttons for downloading the report -->
    <div class="download-buttons">
        <span>Download Report:</span>
        <form th:action="@{/reports/animal-distribution/download/pdf}" method="get" style="display:inline;">
            <button type="submit" class="btn">PDF</button>
        </form>
        <form th:action="@{/reports/animal-distribution/download/excel}" method="get" style="display:inline;">
            <button type="submit" class="btn">Excel</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Animal Type</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${animalDistribution}">
                <td th:text="${entry.type}">Type</td>
                <td th:text="${entry.count}">Count</td>
            </tr>
        </tbody>
    </table>
	
	<footer class="footer">
			<div class="footer-links">
				<a href="/about">About Us</a>
				<a href="/education">Education</a>
				<a href="/pet-care-tips">Pet Care Tips</a>
				<a href="/forum">Community Forum</a>
				<a href="/feedback">Feedback</a>
			</div>
			<div class="social-icons">
				<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
				<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
				<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
				<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
			</div>
			<p>&copy; 2024 PETURA: Love Knows No Species</p>
			<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
		</footer>
	
</body>
</html>
