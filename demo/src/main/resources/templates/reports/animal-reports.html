<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Animal Reports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            color: #333;
        }
        .filter {
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Animal Reports</h1>

    <!-- Buttons for downloading the report -->
    <div class="filter">
        <span>Download Report:</span>
        <form th:action="@{/reports/animal-reports/download/pdf}" method="get" style="display:inline;">
            <button type="submit" class="btn">PDF</button>
        </form>
        <form th:action="@{/reports/animal-reports/download/excel}" method="get" style="display:inline;">
            <button type="submit" class="btn">Excel</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Animal Name</th>
                <th>Type</th>
                <th>Health Status</th>
                <th>Doctor Appointment</th>
                <th>Shelter Name</th>
                <th>Adoption Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="animal : ${animalReports}">
                <td th:text="${animal.name}"></td>
                <td th:text="${animal.type}"></td>
                <td th:text="${animal.healthStatus}"></td>
                <td th:text="${animal.doctorAppointment}"></td>
                <td th:text="${animal.shelterName}"></td>
                <td th:text="${animal.adoptionStatus}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
