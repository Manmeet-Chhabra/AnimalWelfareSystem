<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Manage Shelter Capacity</title>
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f9f9f9;
			color: #333;
			margin: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}


		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			/* Green color for Donate Now button */
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		h1 {
			text-align: center;
			color: #4CAF50;
			margin-bottom: 20px;
		}

		.container {
			max-width: 1000px;
			margin: 80px auto;
			flex: 1;
			padding: 20px;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		nav a {
			color: white;
			text-decoration: none;
			margin: 0 10px;
		}

		nav a:hover {
			text-decoration: underline;
		}

		main {
			max-width: 800px;
			margin: 20px auto;
			padding: 20px;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
		}

		h2 {
			margin-bottom: 20px;
		}

		form {
			margin-bottom: 20px;
		}

		form label {
			display: block;
			margin-bottom: 5px;
			font-weight: bold;
		}

		form input[type="number"] {
			width: 100%;
			padding: 10px;
			margin-bottom: 10px;
			border: 1px solid #ccc;
			border-radius: 4px;
		}

		form button {
			background-color: #4CAF50;
			color: white;
			border: none;
			padding: 10px 20px;
			border-radius: 4px;
			cursor: pointer;
		}

		form button:hover {
			background-color: #45a049;
		}

		.message {
			text-align: center;
			font-size: 18px;
			margin-bottom: 20px;
		}

		.message.success {
			color: green;
		}

		.message.error {
			color: red;
		}

		.back-link:hover {
			text-decoration: underline;
		}

		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
			position: relative;
						/* Ensure the footer moves with the page content */
						bottom: 0;
						/* Keep the footer at the bottom of the page */
						margin-top: auto;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}
	</style>
</head>

<body>
	<div class="header">
		<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
		<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
		<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now </a>
			<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
		</div>
	</div>

	<div class="container">
		<h1>Manage Shelter Capacity</h1>
		<nav>
			<a href="/home">Home</a>
			<a href="/shelters">Shelter List</a>
		</nav>
		<main>
			<h2>Shelter ID: <span th:text="${shelter.id}"></span></h2>
			<div th:if="${success}" class="message success" th:text="${success}"></div>
			<div th:if="${error}" class="message error" th:text="${error}"></div>
			<form th:action="@{/shelters/{id}/capacity/increase(id=${shelter.id})}" method="post">
				<label for="increment">Increase Capacity by:</label>
				<input type="number" id="increment" name="increment" required>
				<button type="submit">Increase Capacity</button>
			</form>
			<form th:action="@{/shelters/{id}/capacity/decrease(id=${shelter.id})}" method="post">
				<label for="decrement">Decrease Capacity by:</label>
				<input type="number" id="decrement" name="decrement" required>
				<button type="submit">Decrease Capacity</button>
			</form>

		</main>
		<a href="/shelters" class="back-link">Back to Shelter List</a>
</div>
		<footer class="footer">
			<div class="footer-links">
				<a href="/about">About Us</a>
				<a href="/education">Education</a>
				<a href="/pet-care-tips">Pet Care Tips</a>
				<a href="/forum">Community Forum</a>
				<a href="/feedback">Feedback</a>
			</div>
			<div class="social-icons">
				<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
				<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
				<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
				<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
			</div>
			<p>&copy; 2024 PETURA: Love Knows No Species</p>
			<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
		</footer>
</body>

</html>
