<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Review Adoption Request</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f9f9f9;
			color: #333;
			margin: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.container {
			margin-top: 100px;
			/* Adjusted for the fixed header */
			padding: 20px;
			flex: 1;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
		}

		h1 {
			color: #4CAF50;
			margin-bottom: 30px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
		}

		th,
		td {
			border: 1px solid black;
			padding: 8px;
			text-align: left;
		}

		th {
			background-color: #f2f2f2;
		}

		.button {
			background-color: #4CAF50;
			color: white;
			padding: 10px 20px;
			/* Enhanced padding */
			text-decoration: none;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.button:hover {
			background-color: #45a049;
		}

		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}

		.btn {
			background-color: #4CAF50;
			color: white;
			padding: 10px 20px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			transition: background-color 0.3s;
		}

		.btn:hover {
			background-color: #45a049;
		}

		.form-group {
			margin-bottom: 20px;
		}


		#comments {
			width: 100%;
		}
	</style>
</head>



<body>

	<div class="header">
		<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
		<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
		<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now </a>
			<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
		</div>
	</div>

	<div class="container">
		<h1>Review Adoption Request</h1>

		<div>
			<h2>Request Details</h2>
			<table>
				<tr>
					<th>Adoption Request ID</th>
					<td th:text="${adoptionRequest.id}"></td>
				</tr>
				<tr>
					<th>Animal ID</th>
					<td th:text="${adoptionRequest.animal.id}"></td>
				</tr>

				<tr>
					<th>User ID</th>
					<td th:text="${adoptionRequest.user.id}"></td>
				</tr>
				<tr>
					<th>Status</th>
					<td th:text="${adoptionRequest.status}"></td>
				</tr>
				<tr>
					<th>Score</th>
					<td th:text="${adoptionRequest.score}"></td>
				</tr>
			</table>

			<h2>Decision</h2>
			<form th:action="@{/adoptions/update-status}" method="post">
				<input type="hidden" name="requestId" th:value="${adoptionRequest.id}" />

				<div class="form-group">
					<label for="decision">Decision:</label>
					<select id="decision" name="decision" class="form-control">
						<option value="APPROVED">Approve</option>
						<option value="REJECTED">Reject</option>
					</select>
				</div>

				<div class="form-group">
					<label for="comments">Comments:</label>
					<textarea id="comments" name="comments" class="form-control" rows="2"></textarea>
				</div>

				<button type="submit" class="btn btn-primary mt-3">Submit Decision</button>
			</form>


		</div>
	</div>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
		</div>
		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>

</body>

</html>
