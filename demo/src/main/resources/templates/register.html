<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>PETURA: Love Knows No Species</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">


	<style>
		html,
		body {
			height: 100%;
		}

		body {
			font-family: Arial, sans-serif;
			background-color: #f9f9f9;
			color: #333;
			margin: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.container {
			width: 80%;
			margin: 100px auto 20px;
			flex: 1;
			/* Adjusted margin for fixed header */
			padding: 20px;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		h1 {
			text-align: center;
			color: #4CAF50;
			margin-bottom: 20px;
		}


		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}

		.form-group {
			margin-bottom: 1rem;
		}

		.btn-primary {
			display: flex;
			align-items: center;
		}

		.btn-primary i {
			margin-right: 0.5rem;
		}
	</style>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
	<div class="header">
		<div class="left-section">
			<img src="/images/logo.jpg" alt="PETURA Logo" class="logo">
		</div>
		<div class="center-section">
			<span class="app-name">PETURA: Love Knows No Species</span>
		</div>
		<div class="right-section">
			<a href="/donations" class="donate-btn">
				<i class="fas fa-donate"></i> Donate Now
			</a>
			<a href="/logout" class="logout-btn">
				<i class="fas fa-sign-out-alt"></i> Logout
			</a>
		</div>
	</div>

	<div class="container">
		<div class="row col-md-8 offset-md-2">
			<div class="card">
				<div th:if="${param.success}">
					<div class="alert alert-info">You've successfully registered to our app!</div>
				</div>
				<div class="card-header">
					<h2 class="text-center">Registration</h2>
				</div>
				<div class="card-body">
					<form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
						<div class="form-group mb-3">
							<label class="form-label">First Name</label>
							<input class="form-control" id="firstName" name="firstName" placeholder="Enter first name"
								th:field="*{firstName}" type="text" />
							<p th:errors="*{firstName}" class="text-danger" th:if="${#fields.hasErrors('firstName')}">
							</p>
						</div>

						<div class="form-group mb-3">
							<label class="form-label">Last Name</label>
							<input class="form-control" id="lastName" name="lastName" placeholder="Enter last name"
								th:field="*{lastName}" type="text" />
							<p th:errors="*{lastName}" class="text-danger" th:if="${#fields.hasErrors('lastName')}"></p>
						</div>

						<!-- Role Selection Dropdown -->
						<div class="form-group mb-3">
							<label class="form-label">Role</label>
							<select class="form-control" id="role" name="role" th:field="*{role}" required>
								<option value="ROLE_USER">User</option>
								<option value="ROLE_ADMIN">Admin</option>
								<option value="ROLE_STAFF">Staff</option>
							</select>
							<p th:errors="*{role}" class="text-danger" th:if="${#fields.hasErrors('role')}"></p>
						</div>

						<div class="form-group mb-3">
							<label class="form-label">Email</label>
							<input class="form-control" id="email" name="email" placeholder="Enter email address"
								th:field="*{email}" type="email" />
							<p th:errors="*{email}" class="text-danger" th:if="${#fields.hasErrors('email')}"></p>
						</div>
						<div class="form-group mb-3">
							<label class="form-label">Password</label>
							<input class="form-control" id="password" name="password" placeholder="Enter password"
								th:field="*{password}" type="password" />
							<p th:errors="*{password}" class="text-danger" th:if="${#fields.hasErrors('password')}"></p>
						</div>

						<div class="form-group mb-3">
							<button class="btn btn-primary" type="submit">
								<i class="fas fa-user-plus"></i> Register
							</button>
							<span>Already registered? <a href="/" th:href="@{/login}">Login here</a></span>
						</div>

					</form>
				</div>
			</div>
		</div>
	</div>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
		</div>
		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>
</body>

</html>
