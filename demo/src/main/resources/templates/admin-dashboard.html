<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Dashboard</title>
	<link rel="stylesheet" href="styles.css"> <!-- Link to your custom styles -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<style>
		body {
			background-color: #f8f9fa;
		}

		.container {
			margin-top: 20px;
		}

		h1 {
			color: #343a40;
		}

		nav ul {
			list-style: none;
			padding: 0;
		}

		nav ul li {
			margin-bottom: 10px;
		}

		nav ul li a {
			text-decoration: none;
			color: #007bff;
			font-weight: bold;
		}

		nav ul li a:hover {
			text-decoration: underline;
		}

		.btn-custom {
			background-color: #007bff;
			color: white;
			border: none;
			border-radius: 0.25rem;
			padding: 10px 15px;
			text-align: center;
			display: block;
			margin-bottom: 10px;
		}

		.btn-custom:hover {
			background-color: #0056b3;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1 class="text-center mb-4">Admin Dashboard</h1>

		<nav class="mb-4">
			<ul class="navbar-nav">
				<li><a class="btn btn-custom" th:href="@{/animals}">View Animals</a></li>
				<li><a class="btn btn-custom" th:href="@{/shelters}">View Shelters</a></li>
				<li><a class="btn btn-custom" th:href="@{/users}">Manage Users</a></li>
				<li><a class="btn btn-custom" th:href="@{/adoptions/requests}">View Adoption Requests</a></li>
				<li><a class="btn btn-custom" th:href="@{/reports/history}">View Your Reports</a></li>
				<li><a class="btn btn-custom" th:href="@{/reports}">View All Reports</a></li>
				<li><a class="btn btn-custom" th:href="@{/logout}">Logout</a></li>
			</ul>
		</nav>

		<!-- Loop through reports to create buttons -->
		<h2>Reports</h2>
		<ul class="navbar-nav">
			<li th:each="report : ${reports}">
				<a class="btn btn-custom" th:href="@{/reports/view/{id}(id=${report.id})}">View Report Details</a>
				<a class="btn btn-custom" th:href="@{/reports/{reportId}/attachment/{attachmentId}(reportId=${report.id}, attachmentId=${attachment.id})}">View Attachment</a>
			</li>
		</ul>

	</div>

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
