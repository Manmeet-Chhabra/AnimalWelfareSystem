<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>My Reports</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			background-color: #f4f4f4;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		h1 {
			margin-top: 100px;
			text-align: center;
			color: #333;
		}

		.container {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 20px;
		}

		table {
			width: 100%;
			max-width: 1000px;
			border-collapse: collapse;
			margin-top: 20px;
			background-color: #fff;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
			overflow: hidden;
		}

		th,
		td {
			padding: 12px 15px;
			border: 1px solid #ddd;
			text-align: left;
		}

		th {
			background-color: #007bff;
			color: white;
			text-align: center;
		}

		tr:nth-child(even) {
			background-color: #f9f9f9;
		}

		tr:hover {
			background-color: #f1f1f1;
		}

		a {
			color: #007BFF;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.footer {
			width: 100%;
			/* Ensure footer takes the full width of the screen */
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
			/* Ensure text is white */
			font-size: 16px;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white !important;
			/* Ensure link text is white */
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50 !important;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white !important;
			/* Ensure icon text is white */
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50 !important;
		}

		/* Increasing specificity */
		body .footer,
		.footer .footer-links a,
		.footer .social-icons a {
			color: white !important;
			font-size: 16px;
			/* Ensuring consistent font size */
		}
	</style>
</head>

<body>
	<div class="header">
		<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
		<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
		<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now
			</a>
			<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
		</div>
	</div>

	<div class="container">
		<h1>My Report History</h1>
		<table>
			<thead>
				<tr>
					<th>Type</th>
					<th>Description</th>
					<th>Address</th>
					<th>Date</th>
					<th>Details</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="report : ${reports}">
					<td th:text="${report.type}"></td>
					<td th:text="${report.description}"></td>
					<td th:text="${report.address}"></td>
					<td th:text="${report.reportDate}"></td>
					<td><a th:href="@{/reports/view/{id}(id=${report.id})}">View Details</a></td>
				</tr>
				<tr th:if="${#lists.isEmpty(reports)}">
					<td colspan="5">No reports found.</td>
				</tr>
			</tbody>
		</table>
	</div>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"
					style="color: white;"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter" style="color: white;"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"
					style="color: white;"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"
					style="color: white;"></i></a>
		</div>

		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>
</body>

</html>
