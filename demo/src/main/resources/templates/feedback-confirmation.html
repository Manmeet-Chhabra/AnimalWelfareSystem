<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Feedback Confirmation</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background-color: #2c3e50;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 100;
            box-sizing: border-box;
        }

        .header .left-section {
            display: flex;
            align-items: center;
        }

        .header .center-section {
            text-align: center;
            flex-grow: 1;
        }

        .header .right-section {
            display: flex;
            align-items: center;
        }

        .header .logo {
            margin-right: 10px;
            height: 40px;
        }

        .header .app-name {
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        .donate-btn {
            color: white;
            background-color: #4CAF50;
            margin-right: 10px;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .donate-btn:hover {
            background-color: #45a049;
        }

        .logout-btn {
            color: white;
            background-color: #e74c3c;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .container {
            width: 80%;
            margin: 100px auto 20px;
            flex: 1;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            padding: 20px 0;
            background-color: #2c3e50;
            color: white;
        }

        .footer .footer-links {
            margin-bottom: 10px;
        }

        .footer .footer-links a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer .footer-links a:hover {
            color: #4CAF50;
        }

        .footer .social-icons {
            margin-top: 10px;
        }

        .footer .social-icons a {
            color: white;
            margin: 0 5px;
            text-decoration: none;
            font-size: 20px;
            transition: color 0.3s;
        }

        .footer .social-icons a:hover {
            color: #4CAF50;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="header">
        <div class="left-section">
            <img src="/images/logo.jpg" alt="PETURA Logo" class="logo">
        </div>
        <div class="center-section">
            <span class="app-name">PETURA: Love Knows No Species</span>
        </div>
        <div class="right-section">
            <a href="/donations" class="donate-btn">
                <i class="fas fa-donate"></i> Donate Now
            </a>
            <a href="/logout" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <div class="container mt-5">
        <h1 class="text-center">Thank You for Your Feedback!</h1>
        <p class="text-center">We appreciate your input and will use it to improve our services.</p>
    </div>
    
    <footer class="footer mt-5">
        <div class="footer-links">
            <a href="/about">About Us</a>
            <a href="/education">Education</a>
            <a href="/pet-care-tips">Pet Care Tips</a>
            <a href="/forum">Community Forum</a>
            <a href="/feedback">Feedback</a>
        </div>
        <div class="social-icons">
            <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <p>&copy; 2024 PETURA: Love Knows No Species</p>
    </footer>
</body>
</html>
