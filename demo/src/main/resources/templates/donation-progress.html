<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Donation Progress</title>
	<style>
		.progress-container {
			width: 80%;
			background-color: #ddd;
			margin: auto;
			border-radius: 25px;
			padding: 5px;
		}

		.progress-bar {
			height: 30px;
			width: 0;
			background-color: #28a745;
			text-align: center;
			color: white;
			border-radius: 25px;
			transition: width 0.5s ease;
		}

		.progress-message {
			text-align: center;
			margin-top: 10px;
			font-size: 1.2em;
		}

		.alert {
			color: red;
			text-align: center;
			margin: 15px 0;
		}

		.alert-success {
			color: green;
		}

		.alert-danger {
			color: red;
		}
	</style>
</head>

<body>
	<header>
		<h2>Donation Goal Progress</h2>
	</header>

	<main>
		<div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
		<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

		<div class="progress-container" aria-label="Donation progress">
			<div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0"
				aria-valuemax="100"></div>
		</div>

		<div class="progress-message" id="progress-message">
			We’re at <span id="progress-percent">0</span>% of our goal! Every donation gets us closer.
		</div>
	</main>

	<script>
		const goalAmount = /*[[${goalAmount}]]*/ null; // Use Thymeleaf to inject value
		const currentTotal = /*[[${currentTotal}]]*/ null; // Use Thymeleaf to inject value

		// Convert to numbers, with safety checks
		const goalAmountNum = parseFloat(goalAmount) || 0;
		const currentTotalNum = parseFloat(currentTotal) || 0;

		// Calculate percentage
		let progressPercent = goalAmountNum > 0 ? Math.min((currentTotalNum / goalAmountNum) * 100, 100) : 0;

		// Update UI elements
		document.getElementById('progress-bar').style.width = progressPercent + '%';
		document.getElementById('progress-percent').textContent = Math.round(progressPercent);
		console.log("Goal Amount Num:", goalAmountNum);
		console.log("Current Total Num:", currentTotalNum);
		console.log("Progress Percent:", progressPercent);
		// Update progress message
		const progressMessage = document.getElementById('progress-message');
		if (progressPercent >= 100) {
			progressMessage.textContent = "Goal achieved! Thank you for your support!";
		} else if (goalAmountNum === 0) {
			progressMessage.textContent = "No current goal set. Every little bit helps!";
		} else {
			progressMessage.textContent = `We’re at ${Math.round(progressPercent)}% of our goal! Every donation gets us closer.`;
		}
	</script>
</body>

</html>
