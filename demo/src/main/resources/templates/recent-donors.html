<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recent Donors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Recent Donors</h1>
    <div>
        <table>
            <thead>
                <tr>
                    <th>Donation Type</th>
                    <th>Donor Name</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="donor : ${recentDonors}">
                    <td th:text="${donor.donationType.displayName}"></td>
                    <td th:text="${donor.donorName}"></td>
                    <td th:text="${donor.quantity != null ? donor.quantity : 'N/A'}"></td>
                    <td th:text="${donor.amount != null ? '$ ' + donor.amount : 'N/A'}"></td>
                    <td th:text="${donor.date}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
