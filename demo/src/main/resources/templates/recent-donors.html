<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recent Donors</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
			display: flex;
						flex-direction: column;
						min-height: 100vh;
					}

					.header {
						background-color: #2c3e50;
						padding: 15px 20px;
						display: flex;
						justify-content: space-between;
						align-items: center;
						width: 100%;
						position: fixed;
						top: 0;
						z-index: 100;
						box-sizing: border-box;
					}

					.header .left-section {
						display: flex;
						align-items: center;
					}

					.header .center-section {
						position: absolute;
						left: 50%;
						transform: translateX(-50%);
					}

					.header .right-section {
						display: flex;
						align-items: center;
					}

					.header .logo {
						margin-right: 10px;
						height: 40px;
					}

					.header .app-name {
						font-size: 18px;
						color: white;
						font-weight: bold;
						text-align: center;
					}

					.donate-btn {
						color: white;
						font-size: 16px;
						text-decoration: none;
						padding: 8px 12px;
						background-color: #4CAF50;
						/* Green color for Donate Now button */
						border-radius: 5px;
						margin-right: 10px;
						transition: background-color 0.3s;
					}

					.donate-btn:hover {
						background-color: #45a049;
					}

					.logout-btn {
						color: white;
						font-size: 16px;
						text-decoration: none;
						padding: 8px 12px;
						background-color: #e74c3c;
						border-radius: 5px;
						transition: background-color 0.3s;
					}

					.logout-btn:hover {
						background-color: #c0392b;
					}

        h1 {
			margin-top: 100px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            color: #333;
        }
        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: rgb(0, 0, 0);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
		.footer {
					margin-top: 50px;
					text-align: center;
					padding: 10px;
					background-color: #f8f9fa;
					width: 100%; /* Ensure footer takes full width */
				}

				.footer {
					text-align: center;
					margin-top: 20px;
					padding: 20px 0;
					background-color: #2c3e50;
					color: white;
				}

				.footer .footer-links {
					margin-bottom: 10px;
				}

				.footer .footer-links a {
					color: white;
					margin: 0 10px;
					text-decoration: none;
					transition: color 0.3s;
				}

				.footer .footer-links a:hover {
					color: #4CAF50;
				}

				.footer .social-icons {
					margin-top: 10px;
				}

				.footer .social-icons a {
					color: white;
					margin: 0 5px;
					text-decoration: none;
					font-size: 20px;
					transition: color 0.3s;
				}

				.footer .social-icons a:hover {
					color: #4CAF50;
				}
    </style>
</head>
<body>
	<div class="header">
			<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
			<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
			<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now </a>
				<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
			</div>
		</div>
    <h1>Recent Donors</h1>
    <div>
        <table>
            <thead>
                <tr>
                    <th>Donation Type</th>
                    <th>Donor Name</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="donor : ${recentDonors}">
                    <td th:text="${donor.donationType.displayName}"></td>
                    <td th:text="${donor.donorName}"></td>
                    <td th:text="${donor.quantity != null ? donor.quantity : 'N/A'}"></td>
                    <td th:text="${donor.amount != null ? '$ ' + donor.amount : 'N/A'}"></td>
                    <td th:text="${donor.date}"></td>
                </tr>
            </tbody>
        </table>
    </div>
	
	<footer class="footer">
			<div class="footer-links">
				<a href="/about">About Us</a>
				<a href="/education">Education</a>
				<a href="/pet-care-tips">Pet Care Tips</a>
				<a href="/forum">Community Forum</a>
				<a href="/feedback">Feedback</a>
			</div>
			<div class="social-icons">
				<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
				<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
				<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
				<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
			</div>
			<p>&copy; 2024 PETURA: Love Knows No Species</p>
			<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
		</footer>
	
</body>
</html>
