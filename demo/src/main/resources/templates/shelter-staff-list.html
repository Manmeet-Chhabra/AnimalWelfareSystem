<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Shelter Staff List</title>
	<link rel="stylesheet" href="/css/styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f9f9f9;
			color: #333;
			margin: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}


		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			/* Green color for Donate Now button */
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.container {
			width: 80%;
			margin: 50px auto;
			padding: 20px;
			flex: 1;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
		}

		h1 {
			text-align: center;
			color: #4CAF50;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 20px;
			background-color: #fff;
		}

		th,
		td {
			padding: 12px;
			border: 1px solid #ddd;
			text-align: center;
		}

		th {
			background-color: #4CAF50;
			color: white;
		}

		tr:nth-child(even) {
			background-color: #f2f2f2;
		}

		tr:hover {
			background-color: #e9e9e9;
		}

		.actions a {
			color: #4CAF50;
			text-decoration: none;
			margin: 0 5px;
		}

		.actions a:hover {
			text-decoration: underline;
		}

		.back-link {
			display: block;
			text-align: center;
			margin-top: 20px;
			color: #4CAF50;
			text-decoration: none;
			font-size: 18px;
		}

		.back-link:hover {
			text-decoration: underline;
		}

		.success-message,
		.error-message {
			text-align: center;
			font-size: 18px;
			margin-bottom: 20px;
		}

		.success-message {
			color: green;
		}

		.error-message {
			color: red;
		}

		.add-staff-link {
			text-align: center;
			margin-top: 20px;
			margin-bottom: 20px;
		}

		.add-staff-link a {
			color: #4CAF50;
			text-decoration: none;
			font-size: 18px;
		}

		.add-staff-link a:hover {
			text-decoration: underline;
		}

		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
			position: relative;
						/* Ensure the footer moves with the page content */
						bottom: 0;
						/* Keep the footer at the bottom of the page */
						margin-top: auto;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}
	</style>
</head>

<body>
	<div class="header">
		<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
		<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
		<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now </a>
			<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
		</div>
	</div>


	<div class="container">
		<h1>Shelter Staff List</h1>
		<div th:if="${success}" class="success-message" th:text="${success}"></div>
		<div th:if="${error}" class="error-message" th:text="${error}"></div>

		<div class="add-staff-link">
			<a th:href="@{/shelters/{shelterId}/staff/add(shelterId=${shelterId})}">Add Staff</a>
		</div>

		<table>
			<thead>
				<tr>
					<th>Name</th>
					<th>Email</th>
					<th>Role</th>
					<th>Shelter</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="member : ${staff}">
					<td th:text="${member.name}"></td>
					<td th:text="${member.email}"></td>
					<td th:text="${member.roles[0].name}"></td>
					<td th:text="${member.shelter.name}"></td>
					<td class="actions">
						<a th:href="@{/shelters/{shelterId}/staff/delete/{staffId}(shelterId=${shelterId}, staffId=${member.id})}"
							onclick="return confirm('Are you sure you want to remove this staff member?');">Remove</a>
					</td>
				</tr>
			</tbody>
		</table>
		<a class="back-link" th:href="@{/shelters/{shelterId}(shelterId=${shelterId})}">Back to Shelter</a>
	</div>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
		</div>
		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>

</body>

</html>
