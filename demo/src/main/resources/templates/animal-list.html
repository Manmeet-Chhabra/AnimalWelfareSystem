<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<title>Animal List</title>
	<link rel="stylesheet" href="/css/styles.css">
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f9f9f9;
			color: #333;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}


		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			/* Green color for Donate Now button */
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.container {
			width: 80%;
			margin: 0 auto;
			flex: 1;
			padding: 100px 20px 20px;
			/* Adjusted padding to account for fixed header */
		}

		h1 {
			text-align: center;
			color: #4CAF50;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
			background-color: #fff;
		}

		th,
		td {
			padding: 12px;
			border: 1px solid #ddd;
			text-align: center;
		}

		th {
			background-color: #4CAF50;
			color: white;
		}

		tr:nth-child(even) {
			background-color: #f2f2f2;
		}

		.actions a {
			color: #4CAF50;
			text-decoration: none;
			margin: 0 5px;
		}

		.actions a:hover {
			text-decoration: underline;
		}

		.form-adopt {
			display: inline-block;
		}

		.form-adopt button {
			background-color: #4CAF50;
			color: white;
			border: none;
			padding: 5px 10px;
			cursor: pointer;
		}

		.form-adopt button:hover {
			background-color: #45a049;
		}

		.filter-form {
			text-align: center;
			margin-bottom: 20px;
		}

		.filter-form select {
			padding: 5px;
			font-size: 16px;
		}

		.back-link {
			display: block;
			text-align: center;
			margin-top: 20px;
			color: #4CAF50;
			text-decoration: none;
		}

		.back-link:hover {
			text-decoration: underline;
		}

		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
			position: relative;
									/* Ensure the footer moves with the page content */
									bottom: 0;
									/* Keep the footer at the bottom of the page */
									margin-top: auto;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}
	</style>
</head>

<body>
	<div class="header">
		<div class="left-section"> <img src="/images/logo.jpg" alt="PETURA Logo" class="logo"> </div>
		<div class="center-section"> <span class="app-name">PETURA: Love Knows No Species</span> </div>
		<div class="right-section"> <a href="/donations" class="donate-btn"> <i class="fas fa-donate"></i> Donate Now </a>
			<a href="/logout" class="logout-btn"> <i class="fas fa-sign-out-alt"></i> Logout </a>
		</div>
	</div>




	<div class="container">
		<h1>Animal List</h1>
		<form class="filter-form" action="/animals" method="get">
			<label for="typeFilter">Filter by Type:</label>
			<select id="typeFilter" name="type">
				<option value="">All</option>
				<option value="Dog">Dog</option>
				<option value="Cat">Cat</option>
				<option value="Bird">Bird</option>
				<option value="Cow">Cow</option>
				<option value="Rabbit">Rabbit</option>
				<option value="Sheep">Sheep</option>
				<option value="Other">Other</option>
				<!-- Add other types as needed -->
			</select>
			<button type="submit">Filter</button>
		</form>
		<table>
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Type</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="animal : ${animals}">
					<td th:text="${animal.id}"></td>
					<td th:text="${animal.name}"></td>
					<td th:text="${animal.type}"></td>
					<td class="actions">
						<a th:href="@{/animals/{id}(id=${animal.id})}">Details</a> |
						<a th:href="@{/animals/{id}/edit(id=${animal.id})}"
							th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''STAFF'')')}">Edit</a> |
						<a th:href="@{/animals/{id}/delete(id=${animal.id})}" class="btn"
							th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''STAFF'')')}"
							onclick="confirmDelete(event)">Delete</a>
						<form class="form-adopt" th:action="@{/adoptions/{animalId}/submit(animalId=${animal.id})}"
							method="post" th:if="${animal.adoptionStatus == 'AVAILABLE'}">
							<input type="hidden" name="userId" th:value="${#authentication.principal.id}" />
							<button type="submit">Adopt</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
		<a href="/animals/create" class="back-link"
			th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''STAFF'')')}">Create New Animal</a>
	</div>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
		</div>
		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>

</body>

</html>
