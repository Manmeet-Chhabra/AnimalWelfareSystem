<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Error</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<style>
		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			background-color: #f9f9f9;
			margin: 0;
			font-family: Arial, sans-serif;

		}

		.header {
			background-color: #2c3e50;
			padding: 15px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			position: fixed;
			top: 0;
			z-index: 100;
			box-sizing: border-box;
		}

		.header .left-section {
			display: flex;
			align-items: center;
		}

		.header .center-section {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
		}

		.header .right-section {
			display: flex;
			align-items: center;
		}

		.header .logo {
			margin-right: 10px;
			height: 40px;
		}

		.header .app-name {
			font-size: 18px;
			color: white;
			font-weight: bold;
			text-align: center;
		}

		.donate-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #4CAF50;
			/* Green color for Donate Now button */
			border-radius: 5px;
			margin-right: 10px;
			transition: background-color 0.3s;
		}

		.donate-btn:hover {
			background-color: #45a049;
		}

		.logout-btn {
			color: white;
			font-size: 16px;
			text-decoration: none;
			padding: 8px 12px;
			background-color: #e74c3c;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.logout-btn:hover {
			background-color: #c0392b;
		}

		.error-container {
			text-align: center;
			padding: 20px;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
			margin-top: 100px;
			/* Adjusted margin for fixed header */
		}

		.error-container h1 {
			font-size: 48px;
			color: #e74c3c;
			margin-bottom: 20px;
		}

		.error-container p {
			font-size: 18px;
			color: #666;
			margin-bottom: 20px;
		}

		.error-container a {
			color: #fff;
			background-color: #4CAF50;
			padding: 10px 20px;
			text-decoration: none;
			border-radius: 5px;
			transition: background-color 0.3s;
		}

		.error-container a:hover {
			background-color: #45a049;
		}

		.error-image {
			width: 100%;
			max-width: 300px;
			margin-bottom: 20px;
		}

		.footer {
			margin-top: 50px;
			text-align: center;
			padding: 10px;
			background-color: #f8f9fa;
			width: 100%; /* Ensure footer takes full width */
		}

		.footer {
			text-align: center;
			margin-top: 20px;
			padding: 20px 0;
			background-color: #2c3e50;
			color: white;
		}

		.footer .footer-links {
			margin-bottom: 10px;
		}

		.footer .footer-links a {
			color: white;
			margin: 0 10px;
			text-decoration: none;
			transition: color 0.3s;
		}

		.footer .footer-links a:hover {
			color: #4CAF50;
		}

		.footer .social-icons {
			margin-top: 10px;
		}

		.footer .social-icons a {
			color: white;
			margin: 0 5px;
			text-decoration: none;
			font-size: 20px;
			transition: color 0.3s;
		}

		.footer .social-icons a:hover {
			color: #4CAF50;
		}
	</style>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
	<div class="header">
		<div class="left-section">
			<img src="/images/logo.jpg" alt="PETURA Logo" class="logo">
		</div>
		<div class="center-section">
			<span class="app-name">PETURA: Love Knows No Species</span>
		</div>
		<div class="right-section">
			<a href="/donations" class="donate-btn">
				<i class="fas fa-donate"></i> Donate Now
			</a>
			<a href="/logout" class="logout-btn">
				<i class="fas fa-sign-out-alt"></i> Logout
			</a>
		</div>
	</div>

	<div class="error-container">
		<img src="/images/error-page.jpg" alt="Error Image" class="error-image">
		<h1>Error</h1>
		<p>Oops! Something went wrong. Please try again later.</p>
		<a href="/">Go to Home</a>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-c7cD0bbRpjxXx85+phE2KBgHGNIJ/gj38t5p79AauMgyZL0owbsz2FIk5bDq7g5J"
		crossorigin="anonymous"></script>

	<footer class="footer">
		<div class="footer-links">
			<a href="/about">About Us</a>
			<a href="/education">Education</a>
			<a href="/pet-care-tips">Pet Care Tips</a>
			<a href="/forum">Community Forum</a>
			<a href="/feedback">Feedback</a>
		</div>
		<div class="social-icons">
			<a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
			<a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
			<a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
			<a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
		</div>
		<p>&copy; 2024 PETURA: Love Knows No Species</p>
		<p>Contact us at: <a href="mailto:manmeetchhabra@04@gmail.com">support@animalwelfare.org</a></p>
	</footer>

</body>

</html>
