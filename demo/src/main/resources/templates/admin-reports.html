<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>All Reports</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 20px;
        }

        h1 {
            color: #343a40;
            margin-bottom: 20px;
        }

        .btn-custom {
            margin: 0 5px;
        }

        .filter-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #fff;
        }

        .filter-container input,
        .filter-container select {
            margin-right: 10px;
            width: auto;
        }

        .table-responsive {
            margin-top: 20px;
        }

        .modal-header {
            background-color: #007bff;
            color: white;
        }

        .modal-footer .btn {
            width: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center">All Reports</h1>

        <!-- Filter and Search Form -->
        <div class="filter-container">
            <form action="#" th:action="@{/reports/search}" method="get" class="form-inline">
                <input type="text" name="description" class="form-control" placeholder="Description" th:value="${description}" />
                <select name="type" class="form-control">
                    <option value="" th:selected="${selectedType == null}">All Types</option>
                    <option value="ABUSE" th:selected="${selectedType == 'ABUSE'}">Abuse</option>
                    <option value="ACCIDENT" th:selected="${selectedType == 'ACCIDENT'}">Accident</option>
                </select>
                <select name="status" class="form-control">
                    <option value="" th:selected="${selectedStatus == null}">All Statuses</option>
                    <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Pending</option>
                    <option value="APPROVED" th:selected="${selectedStatus == 'APPROVED'}">Approved</option>
                    <option value="REJECTED" th:selected="${selectedStatus == 'REJECTED'}">Rejected</option>
                </select>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>

        <!-- Reports Table -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="report : ${reports}">
                        <td th:text="${report.id}"></td>
                        <td th:text="${report.type}"></td>
                        <td th:text="${report.description}"></td>
                        <td th:text="${report.status}"></td>
                        <td>
                            <a th:href="@{/reports/view/{id}(id=${report.id})}" class="btn btn-info btn-sm">View Details</a>
                            <button class="btn btn-danger btn-sm" data-toggle="modal" data-target="#rejectModal" th:attr="data-id=${report.id}">Reject</button>
                            <button class="btn btn-success btn-sm" data-toggle="modal" data-target="#approveModal" th:attr="data-id=${report.id}">Approve</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Approve Modal -->
    <div class="modal fade" id="approveModal" tabindex="-1" role="dialog" aria-labelledby="approveModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="approveModalLabel">Confirm Approval</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure you want to approve this report? This action will notify the user.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmApprove">Approve</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="modal fade" id="rejectModal" tabindex="-1" role="dialog" aria-labelledby="rejectModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="rejectModalLabel">Confirm Rejection</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure you want to reject this report? Please provide a reason for rejection:
                    <textarea id="rejectReason" class="form-control" placeholder="Enter reason..." required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmReject">Reject</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(function () {
            let currentReportId; // Declare a global variable

            // Handle the click event for approve buttons
            $('#approveModal').on('show.bs.modal', function (event) {
                const button = $(event.relatedTarget); // Button that triggered the modal
                const reportId = button.data('id'); // Extract info from data-id attribute
                $('#confirmApprove').data('id', reportId); // Set report ID as data attribute
                console.log("Report ID for confirmation:", reportId);
            });

            // Confirm Approve Button
            $('#confirmApprove').click(function () {
                const currentReportId = $(this).data('id'); // Get the report ID from the button's data attribute
                console.log("Confirm Approve Button Clicked. Current Report ID:", currentReportId); // Log the ID

                if (currentReportId) {
                    const button = $(this);
                    button.prop('disabled', true).text('Approving...');

                    $.post(`/reports/approve/${currentReportId}`, function (data) {
                        location.reload(); // Reload the page on success
                    }).fail(function (jqXHR) {
                        alert("Error approving report: " + jqXHR.responseText); // Show error on failure
                        button.prop('disabled', false).text('Approve');
                    });

                    $('#approveModal').modal('hide'); // Hide the modal
                } else {
                    alert("Report ID is not set.");
                }
            });

            // Handle the click event for reject buttons
            $('#rejectModal').on('show.bs.modal', function (event) {
                const button = $(event.relatedTarget); // Button that triggered the modal
                currentReportId = button.data('id'); // Extract info from data-id attribute
                console.log("Reject button clicked. Report ID:", currentReportId); // Log the ID
                $('#rejectReason').val(''); // Clear the textarea
            });

            $('#confirmReject').click(function () {
                const reason = $('#rejectReason').val().trim();
                if (reason === "") {
                    alert("Please provide a reason for rejection.");
                    return;
                }

                if (currentReportId) {
                    console.log("Rejecting Report ID:", currentReportId); // Debug log
                    const button = $(this);
                    button.prop('disabled', true).text('Rejecting...');
                    $.post(`/reports/reject/${currentReportId}`, { rejectionReason: reason })
                        .done(function (data) {
                            location.reload(); // Reload the page on success
                        })
                        .fail(function (jqXHR) {
                            alert("Error rejecting report: " + jqXHR.responseText); // Show error on failure
                            button.prop('disabled', false).text('Reject');
                        });

                    $('#rejectModal').modal('hide'); // Hide the modal
                } else {
                    alert("Report ID is not set.");
                }
            });
        });
    </script>
</body>

</html>
