<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your custom styles -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 20px;
        }
        h1 {
            color: #343a40;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            margin-bottom: 10px;
        }
        nav ul li a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 10px 15px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">User Dashboard</h1>
        
        <nav class="mb-4">
            <ul class="navbar-nav">
                <li><a class="btn btn-custom" th:href="@{/animals}">View Available Animals</a></li>
                <li><a class="btn btn-custom" th:href="@{/adoptions/requests}">View My Adoption Requests</a></li>
                <li><a class="btn btn-custom" th:href="@{/reports/new}">Create New Report</a></li>
                <li><a class="btn btn-custom" th:href="@{/reports/history}">View My Report History</a></li>
                <li><a class="btn btn-custom" th:href="@{/logout}">Logout</a></li>
            </ul>
        </nav>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
