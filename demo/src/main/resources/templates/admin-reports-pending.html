<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pending Reports</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 20px;
        }

        h1 {
            color: #343a40;
        }

        .btn-custom {
            margin: 0 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">Pending Reports</h1>
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="report : ${reports}" th:if="${report.status == 'PENDING'}">
                        <td th:text="${report.id}"></td>
                        <td th:text="${report.type}"></td>
                        <td th:text="${report.description}"></td>
                        <td th:text="${report.status}"></td>
                        <td>
                            <a th:href="@{/reports/view/{id}(id=${report.id})}" class="btn btn-info">View Details</a>
                            <button class="btn btn-danger" data-toggle="modal" data-target="#rejectModal" data-id="${report.id}">Reject Report</button>
                            <button class="btn btn-success" data-toggle="modal" data-target="#approveModal" data-id="${report.id}">Approve Report</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Approve Modal -->
    <div class="modal fade" id="approveModal" tabindex="-1" role="dialog" aria-labelledby="approveModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="approveModalLabel">Confirm Approval</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure you want to approve this report? This action will notify the user.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmApprove">Approve</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="modal fade" id="rejectModal" tabindex="-1" role="dialog" aria-labelledby="rejectModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="rejectModalLabel">Confirm Rejection</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure you want to reject this report? Please provide a reason for rejection:
                    <textarea id="rejectReason" class="form-control" placeholder="Enter reason..." required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmReject">Reject</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(function () {
            let currentReportId;

            // Approve button click
            $('#approveModal').on('show.bs.modal', function (event) {
                const button = $(event.relatedTarget);
                currentReportId = button.data('id');
            });

            $('#confirmApprove').click(function () {
                if (currentReportId) {
                    const button = $(this);
                    button.prop('disabled', true).text('Approving...');
                    $.post(`/reports/approve/${currentReportId}`, function (data) {
                        location.reload();
                    }).fail(function (jqXHR) {
                        alert("Error approving report: " + jqXHR.responseText);
                        button.prop('disabled', false).text('Approve');
                    });
                    $('#approveModal').modal('hide');
                } else {
                    alert("Report ID is not set.");
                }
            });

            // Reject button click
            $('#rejectModal').on('show.bs.modal', function (event) {
                const button = $(event.relatedTarget);
                currentReportId = button.data('id');
                $('#rejectReason').val('');
            });

            $('#confirmReject').click(function () {
                const reason = $('#rejectReason').val().trim();
                if (reason === "") {
                    alert("Please provide a reason for rejection.");
                    return;
                }

                if (currentReportId) {
                    const button = $(this);
                    button.prop('disabled', true).text('Rejecting...');
                    $.post(`/reports/reject/${currentReportId}`, { rejectionReason: reason })
                        .done(function (data) {
                            location.reload();
                        })
                        .fail(function (jqXHR) {
                            alert("Error rejecting report: " + jqXHR.responseText);
                            button.prop('disabled', false).text('Reject');
                        });
                    $('#rejectModal').modal('hide');
                } else {
                    alert("Report ID is not set.");
                }
            });
        });
    </script>
</body>

</html>
